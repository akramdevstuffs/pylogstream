[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pylogstream-controller"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pylogstream-protocol>=0.1.0",
    "pyyaml",
    "kazoo>=2.9",
]

[project.scripts]
pylogstream-controller = "pylogstream_controller.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

